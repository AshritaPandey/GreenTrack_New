<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Architecture</title>
    <style>
        :root {
            --primary: #52b788;
            --secondary: #95d5b2;
            --accent: #d8f3dc;
            --bg: #081c15;
            --glass: rgba(255, 255, 255, 0.05);
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            width: 90%;
            max-width: 1000px;
            padding: 40px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 50px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            color: var(--primary);
            font-size: 28px;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }
        .header p {
            color: var(--secondary);
            font-size: 14px;
            opacity: 0.8;
        }
        svg {
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SYSTEM ARCHITECTURE</h1>
            <p>GreenTrack – Full-Stack Data Flow</p>
        </div>
        <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#52b788" />
                </marker>
                <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:rgba(82, 183, 136, 0.2);stop-opacity:1" />
                    <stop offset="100%" style="stop-color:rgba(82, 183, 136, 0.05);stop-opacity:1" />
                </linearGradient>
            </defs>

            <!-- User -->
            <circle cx="100" cy="300" r="30" fill="none" stroke="#52b788" stroke-width="2" />
            <circle cx="100" cy="290" r="10" fill="#52b788" />
            <path d="M80 320 Q100 310 120 320" stroke="#52b788" stroke-width="2" fill="none"/>
            <text x="100" y="350" text-anchor="middle" fill="white" font-size="12">USER</text>

            <!-- Arrow from User to Client -->
            <path d="M140 300 L190 300" stroke="#52b788" stroke-width="2" marker-end="url(#arrow)" />

            <!-- Client Layer -->
            <rect x="200" y="50" width="220" height="500" rx="20" fill="url(#boxGrad)" stroke="#52b788" stroke-width="2" stroke-dasharray="5,5"/>
            <text x="310" y="40" text-anchor="middle" fill="#52b788" font-weight="bold">CLIENT SIDE</text>
            
            <rect x="220" y="100" width="180" height="80" rx="10" fill="var(--glass)" stroke="white" stroke-opacity="0.2"/>
            <text x="310" y="135" text-anchor="middle" fill="white" font-size="14" font-weight="bold">WEB BROWSER</text>
            <text x="310" y="155" text-anchor="middle" fill="white" font-size="12" opacity="0.6">HTML / CSS / JS</text>

            <rect x="220" y="260" width="180" height="80" rx="10" fill="var(--glass)" stroke="white" stroke-opacity="0.2"/>
            <text x="310" y="295" text-anchor="middle" fill="white" font-size="14" font-weight="bold">FETCH API</text>
            <text x="310" y="315" text-anchor="middle" fill="white" font-size="12" opacity="0.6">Async HTTP / REST</text>

            <rect x="220" y="420" width="180" height="80" rx="10" fill="var(--glass)" stroke="white" stroke-opacity="0.2"/>
            <text x="310" y="455" text-anchor="middle" fill="white" font-size="14" font-weight="bold">CHART.JS</text>
            <text x="310" y="475" text-anchor="middle" fill="white" font-size="12" opacity="0.6">Data Visualization</text>

            <!-- Interaction arrows within client -->
            <path d="M310 180 L310 250" stroke="white" stroke-opacity="0.3" stroke-width="1" marker-end="url(#arrow)"/>
            <path d="M310 340 L310 410" stroke="white" stroke-opacity="0.3" stroke-width="1" marker-end="url(#arrow)"/>

            <!-- Arrow from Client to Server -->
            <path d="M430 300 L530 300" stroke="#52b788" stroke-width="3" marker-end="url(#arrow)" />
            <text x="480" y="290" text-anchor="middle" fill="#52b788" font-size="10">INTERNET / HTTP</text>

            <!-- Server Layer -->
            <rect x="540" y="50" width="220" height="500" rx="20" fill="url(#boxGrad)" stroke="#52b788" stroke-width="2"/>
            <text x="650" y="40" text-anchor="middle" fill="#52b788" font-weight="bold">NODE.JS BACKEND</text>

            <rect x="560" y="100" width="180" height="80" rx="10" fill="var(--glass)" stroke="white" stroke-opacity="0.2"/>
            <text x="650" y="135" text-anchor="middle" fill="white" font-size="14" font-weight="bold">EXPRESS ROUTER</text>
            <text x="650" y="155" text-anchor="middle" fill="white" font-size="12" opacity="0.6">API Endpoint Mapping</text>

            <rect x="560" y="260" width="180" height="120" rx="10" fill="var(--glass)" stroke="white" stroke-opacity="0.2"/>
            <text x="650" y="295" text-anchor="middle" fill="white" font-size="14" font-weight="bold">MIDDLEWARE</text>
            <text x="650" y="320" text-anchor="middle" fill="white" font-size="12" opacity="0.8">- Multer (Images)</text>
            <text x="650" y="340" text-anchor="middle" fill="white" font-size="12" opacity="0.8">- Bcrypt (Security)</text>
            <text x="650" y="360" text-anchor="middle" fill="white" font-size="12" opacity="0.8">- CORS (Policy)</text>

            <rect x="560" y="430" width="180" height="70" rx="10" fill="var(--glass)" stroke="white" stroke-opacity="0.2"/>
            <text x="650" y="465" text-anchor="middle" fill="white" font-size="14" font-weight="bold">DIAGNOSTICS</text>
            <text x="650" y="485" text-anchor="middle" fill="white" font-size="12" opacity="0.6">AI Simulation Logic</text>

            <!-- Arrow from Server to Data -->
            <path d="M770 300 L840 300" stroke="#52b788" stroke-width="2" marker-end="url(#arrow)" />

            <!-- Data Layer -->
            <rect x="850" y="50" width="120" height="500" rx="20" fill="url(#boxGrad)" stroke="#52b788" stroke-width="2" stroke-dasharray="2,2"/>
            <text x="910" y="40" text-anchor="middle" fill="#52b788" font-weight="bold">STORAGE</text>

            <rect x="860" y="100" width="100" height="60" rx="5" fill="var(--glass)" stroke="white" stroke-opacity="0.2"/>
            <text x="910" y="135" text-anchor="middle" fill="white" font-size="10">plants.json</text>

            <rect x="860" y="180" width="100" height="60" rx="5" fill="var(--glass)" stroke="white" stroke-opacity="0.2"/>
            <text x="910" y="215" text-anchor="middle" fill="white" font-size="10">logs.json</text>

            <rect x="860" y="260" width="100" height="60" rx="5" fill="var(--glass)" stroke="white" stroke-opacity="0.2"/>
            <text x="910" y="295" text-anchor="middle" fill="white" font-size="10">users.json</text>

            <rect x="860" y="340" width="100" height="150" rx="5" fill="var(--glass)" stroke="white" stroke-opacity="0.2"/>
            <text x="910" y="415" text-anchor="middle" fill="white" font-size="10">/uploads/</text>
            <text x="910" y="440" text-anchor="middle" fill="white" font-size="9" opacity="0.5">JPG / PNG</text>
            <text x="910" y="455" text-anchor="middle" fill="white" font-size="9" opacity="0.5">Assets</text>

        </svg>
    </div>
</body>
</html>
