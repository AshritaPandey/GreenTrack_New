<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GreenTrack - Welcome</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    /* CSS Variables & Global Reset for Premium Login */
    :root {
      --primary-color: #27ae60;
      --secondary-color: #2ecc71;
      --accent-color: #f1c40f;
      --error-color: #e74c3c;
      --bg-gradient: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
      --glass-bg: rgba(255, 255, 255, 0.15);
      --glass-border: rgba(255, 255, 255, 0.2);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-gradient);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Glass Container */
    .auth-container {
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      padding: 3rem;
      border-radius: 2rem;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      text-align: center;
      color: white;
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-section { margin-bottom: 2rem; }
    .logo-section h1 { font-size: 2.5rem; letter-spacing: -1px; margin-bottom: 0.5rem; }
    .logo-section p { font-weight: 300; opacity: 0.9; }

    /* Forms */
    .form-group { position: relative; margin-bottom: 1.5rem; }
    input {
      width: 100%;
      padding: 1.2rem 1.5rem;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid transparent;
      border-radius: 1rem;
      color: white;
      font-size: 1rem;
      transition: all 0.3s;
    }
    input::placeholder { color: rgba(255, 255, 255, 0.6); }
    input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.5);
    }

    button {
      width: 100%;
      padding: 1.2rem;
      background: var(--accent-color);
      color: #2c3e50;
      border: none;
      border-radius: 1rem;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 10px 20px -5px rgba(241, 196, 15, 0.4);
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 15px 25px -5px rgba(241, 196, 15, 0.5); }
    button:active { transform: translateY(0); }

    .switch-mode { margin-top: 1.5rem; font-size: 0.9rem; }
    .switch-mode a { color: var(--accent-color); text-decoration: none; font-weight: 600; cursor: pointer; }

    /* Notification */
    #notification {
      position: fixed;
      top: 2rem;
      padding: 1rem 2.5rem;
      border-radius: 1rem;
      color: white;
      font-weight: 600;
      transform: translateY(-150%);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1000;
    }
    #notification.show { transform: translateY(0); }
    .error-bg { background: var(--error-color); }
    .success-bg { background: var(--primary-color); }
  </style>
</head>
<body>
  <div id="notification"></div>

  <div class="auth-container">
    <div class="logo-section">
      <img src="https://cdn-icons-png.flaticon.com/512/188/188333.png" width="60" alt="Logo">
      <h1>GreenTrack</h1>
      <p>Nurturing nature, together.</p>
    </div>

    <!-- Login Form -->
    <div id="loginForm">
      <div class="form-group">
        <input type="email" id="loginEmail" placeholder="Email Address">
      </div>
      <div class="form-group">
        <input type="password" id="loginPass" placeholder="Password">
      </div>
      <button onclick="handleLogin()">Login</button>
      <div class="switch-mode">
        New here? <a onclick="toggleForm('signup')">Create an account</a>
      </div>
    </div>

    <!-- Signup Form -->
    <div id="signupForm" style="display: none;">
      <div class="form-group">
        <input type="text" id="signupName" placeholder="Full Name">
      </div>
      <div class="form-group">
        <input type="email" id="signupEmail" placeholder="Email Address">
      </div>
      <div class="form-group">
        <input type="password" id="signupPass" placeholder="Password">
      </div>
      <button onclick="handleSignup()">Join Community</button>
      <div class="switch-mode">
        Already a member? <a onclick="toggleForm('login')">Login instead</a>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "/api";

    function showNotification(message, isError = true) {
      const notif = document.getElementById('notification');
      notif.textContent = message;
      notif.className = isError ? 'error-bg show' : 'success-bg show';
      setTimeout(() => notif.classList.remove('show'), 3000);
    }

    function toggleForm(mode) {
      document.getElementById('loginForm').style.display = mode === 'login' ? 'block' : 'none';
      document.getElementById('signupForm').style.display = mode === 'signup' ? 'block' : 'none';
    }

    async function handleLogin() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPass').value;

      if (!email || !password) return showNotification("Fill in all fields");

      try {
        const response = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();
        if (response.ok) {
          localStorage.setItem('user', JSON.stringify(data.user));
          showNotification("Login successful!", false);
          setTimeout(() => window.location.href = 'main.html', 1000);
        } else {
          showNotification(data.error || "Login failed");
        }
      } catch (err) {
        showNotification("Server error. Ensure backend is running.");
      }
    }

    async function handleSignup() {
      const name = document.getElementById('signupName').value;
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPass').value;

      if (!name || !email || !password) return showNotification("Fill in all fields");

      try {
        const response = await fetch(`${API_URL}/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });

        const data = await response.json();
        if (response.ok) {
          showNotification("Account created! You can now login.", false);
          toggleForm('login');
        } else {
          showNotification(data.error || "Signup failed");
        }
      } catch (err) {
        showNotification("Server error.");
      }
    }
  </script>
</body>
</html>
