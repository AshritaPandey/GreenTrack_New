<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Connect - Block Diagram</title>
    <style>
        :root {
            --primary: #2ecc71;
            --secondary: #27ae60;
            --dark: #2c3e50;
            --light: #ecf0f1;
            --glass: rgba(255, 255, 255, 0.1);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a2e1a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
        }
        .container {
            padding: 40px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            text-align: center;
        }
        svg {
            width: 100%;
            height: auto;
            max-width: 800px;
        }
        .title {
            font-size: 24px;
            margin-bottom: 30px;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Project Architecture: Block Diagram</div>
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <!-- Definitions for Gradients and Shadows -->
            <defs>
                <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
                </linearGradient>
                <filter id="dropshadow" height="130%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
                    <feOffset dx="2" dy="2" result="offsetblur"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.5"/>
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/> 
                    </feMerge>
                </filter>
            </defs>

            <!-- Tiers -->
            <!-- Presentation Tier -->
            <rect x="50" y="50" width="700" height="100" rx="10" fill="rgba(255,255,255,0.05)" stroke="#2ecc71" stroke-width="2"/>
            <text x="400" y="40" text-anchor="middle" fill="#2ecc71" font-weight="bold" font-size="20">PRESENTATION TIER (FRONTEND)</text>
            <rect x="70" y="70" width="200" height="60" rx="5" fill="var(--glass)" stroke="white" stroke-width="1" filter="url(#dropshadow)"/>
            <text x="170" y="105" text-anchor="middle" fill="white" font-size="14">HTML5 / CSS3 (Glassmorphism)</text>
            
            <rect x="300" y="70" width="200" height="60" rx="5" fill="var(--glass)" stroke="white" stroke-width="1" filter="url(#dropshadow)"/>
            <text x="400" y="105" text-anchor="middle" fill="white" font-size="14">Vanilla JS / Fetch API</text>

            <rect x="530" y="70" width="200" height="60" rx="5" fill="var(--glass)" stroke="white" stroke-width="1" filter="url(#dropshadow)"/>
            <text x="630" y="105" text-anchor="middle" fill="white" font-size="14">Chart.js Visualization</text>

            <!-- Arrows -->
            <path d="M400 150 L400 190" stroke="white" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
            
            <!-- Application Tier -->
            <rect x="50" y="200" width="700" height="100" rx="10" fill="rgba(255,255,255,0.05)" stroke="#3498db" stroke-width="2"/>
            <text x="400" y="190" text-anchor="middle" fill="#3498db" font-weight="bold" font-size="20">APPLICATION TIER (BACKEND)</text>
            
            <rect x="70" y="220" width="200" height="60" rx="5" fill="var(--glass)" stroke="white" stroke-width="1" filter="url(#dropshadow)"/>
            <text x="170" y="255" text-anchor="middle" fill="white" font-size="14">Node.js / Express.js</text>

            <rect x="300" y="220" width="200" height="60" rx="5" fill="var(--glass)" stroke="white" stroke-width="1" filter="url(#dropshadow)"/>
            <text x="400" y="255" text-anchor="middle" fill="white" font-size="14">Multer / Image Processing</text>

            <rect x="530" y="220" width="200" height="60" rx="5" fill="var(--glass)" stroke="white" stroke-width="1" filter="url(#dropshadow)"/>
            <text x="630" y="255" text-anchor="middle" fill="white" font-size="14">Bcryptjs / Authentication</text>

            <!-- Arrows -->
            <path d="M400 300 L400 340" stroke="white" stroke-width="2" fill="none"/>

            <!-- Data Tier -->
            <rect x="50" y="350" width="700" height="100" rx="10" fill="rgba(255,255,255,0.05)" stroke="#e67e22" stroke-width="2"/>
            <text x="400" y="340" text-anchor="middle" fill="#e67e22" font-weight="bold" font-size="20">DATA TIER (STORAGE)</text>
            
            <rect x="70" y="370" width="200" height="60" rx="5" fill="var(--glass)" stroke="white" stroke-width="1" filter="url(#dropshadow)"/>
            <text x="170" y="395" text-anchor="middle" fill="white" font-size="14">plants.json (Knowledge)</text>
            <text x="170" y="415" text-anchor="middle" fill="white" font-size="14">logs.json (Tracking)</text>

            <rect x="300" y="370" width="200" height="60" rx="5" fill="var(--glass)" stroke="white" stroke-width="1" filter="url(#dropshadow)"/>
            <text x="400" y="405" text-anchor="middle" fill="white" font-size="14">users.json (Profiles)</text>

            <rect x="530" y="370" width="200" height="60" rx="5" fill="var(--glass)" stroke="white" stroke-width="1" filter="url(#dropshadow)"/>
            <text x="630" y="405" text-anchor="middle" fill="white" font-size="14">/uploads (Plant Media)</text>

            <!-- Marker for arrow -->
            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="white" />
            </marker>
        </svg>
    </div>
</body>
</html>
