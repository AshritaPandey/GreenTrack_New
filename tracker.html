<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenTrack - Growth Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; }
        header {
            background-color: #166534;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-links a { color: white; text-decoration: none; margin-left: 20px; font-size: 0.9rem; }
        
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        
        .tracker-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            position: relative;
            margin-bottom: 30px;
            border-left: 4px solid #166534;
        }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .plant-info h2 { margin: 0; color: #166534; font-size: 1.5rem; }
        .date { color: #64748b; font-size: 0.9rem; display: flex; align-items: center; gap: 5px; margin-top: 5px; }
        
        .height-badge {
            background: #f0fdf4;
            color: #166534;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
            border: 1px solid #dcfce7;
        }
        
        .notes { margin: 20px 0; color: #334155; line-height: 1.6; }
        
        .plant-img {
            width: 200px;
            height: 350px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-health {
            background-color: #065f46;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
        }
        .btn-delete {
            background-color: #991b1b;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <header>
        <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-size: 1.5rem;">🌱</span>
            <h2 style="margin: 0; font-size: 1.2rem;">Growth Tracker</h2>
        </div>
        <div class="header-links">
            <a href="main.html">Home</a>
            <span id="welcomeMsg" style="margin-left: 20px;">Welcome, user 🌿</span>
        </div>
    </header>

    <div class="container" id="trackerList">
        <!-- Replicating your screenshot exactly -->
        <div class="tracker-card">
            <div class="card-header">
                <div class="plant-info">
                    <h2>Mango</h2>
                    <div class="date">📅 25/03/2026</div>
                </div>
                <div class="height-badge">16 cm</div>
            </div>
            
            <p class="notes">Growing well</p>
            
            <img src="images/week 4.jpeg" class="plant-img" alt="Mango Sapling">
            
            <div class="actions">
                <button class="btn-health" onclick="runHealthCheck()">🩺 Run Health Check</button>
                <button class="btn-delete">🗑️ Delete</button>
            </div>
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (user) {
            document.getElementById('welcomeMsg').textContent = `Welcome, ${user.name} 🌿`;
        }

        async function runHealthCheck() {
            // This is the link to the AI logic
            alert("Starting Agricultural Intelligence Scan...");
            window.location.href = "main.html"; // Or open a modal
        }
    </script>
</body>
</html>
