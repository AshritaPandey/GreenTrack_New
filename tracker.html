<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenTrack - Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2ecc71;
            --secondary: #27ae60;
            --dark: #1e272e;
            --light: #f5f6fa;
            --danger: #e74c3c;
            --card-bg: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #1e272e 0%, #2ecc71 100%);
            margin: 0;
            padding: 20px;
            color: var(--dark);
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            color: white;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            transition: 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 600;
            color: var(--primary);
            display: block;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .history-card {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            text-align: left;
            padding: 15px;
            border-bottom: 2px solid #eee;
            color: #666;
            font-weight: 400;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-healthy { background: #e8f8f0; color: #2ecc71; }
        .status-warning { background: #fff5e6; color: #f39c12; }
        .status-critical { background: #feeaea; color: #e74c3c; }

        .image-preview {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
            cursor: pointer;
            transition: 0.3s;
        }

        .image-preview:hover {
            transform: scale(1.1);
        }

        #emptyState {
            text-align: center;
            padding: 50px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Activity Tracker</h1>
            <a href="main.html" class="back-btn">← Back to Dashboard</a>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-value" id="totalScans">0</span>
                <span class="stat-label">Total Scans</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="healthyCount">0</span>
                <span class="stat-label">Healthy Plants</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="alertsCount">0</span>
                <span class="stat-label">Active Alerts</span>
            </div>
        </div>

        <div class="history-card">
            <h2>Recent Activity</h2>
            <div id="emptyState" style="display: none;">
                <p>No activity recorded yet. Start by scanning a plant!</p>
            </div>
            <table id="historyTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Plant</th>
                        <th>Part</th>
                        <th>Diagnosis</th>
                        <th>Status</th>
                        <th>Image</th>
                    </tr>
                </thead>
                <tbody id="historyBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) {
            window.location.href = 'index.html';
        }

        async function loadHistory() {
            try {
                // Use relative API path for cloud compatibility
                const response = await fetch(`/api/logs/${user.email}`);
                const logs = await response.json();
                
                const tbody = document.getElementById('historyBody');
                const emptyState = document.getElementById('emptyState');
                const table = document.getElementById('historyTable');

                if (!logs || logs.length === 0) {
                    emptyState.style.display = 'block';
                    table.style.display = 'none';
                    return;
                }

                // Update Stats
                document.getElementById('totalScans').textContent = logs.length;
                const healthy = logs.filter(l => l.status === 'Healthy').length;
                document.getElementById('healthyCount').textContent = healthy;
                document.getElementById('alertsCount').textContent = logs.length - healthy;

                // Sort by date (newest first)
                logs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

                tbody.innerHTML = logs.map(log => {
                    const statusClass = log.status.toLowerCase().includes('healthy') ? 'status-healthy' : 
                                      log.status.toLowerCase().includes('critical') ? 'status-critical' : 'status-warning';
                    
                    return `
                        <tr>
                            <td>${new Date(log.timestamp).toLocaleDateString()}</td>
                            <td>${log.plant}</td>
                            <td>${log.part || 'Foliage'}</td>
                            <td>${log.diagnosis}</td>
                            <td><span class="status-badge ${statusClass}">${log.status}</span></td>
                            <td><img src="${log.imageUrl}" class="image-preview" onclick="window.open('${log.imageUrl}')"></td>
                        </tr>
                    `;
                }).join('');

            } catch (error) {
                console.error('Error loading history:', error);
            }
        }

        loadHistory();
    </script>
</body>
</html>
