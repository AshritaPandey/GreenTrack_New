<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenTrack - Agricultural Intelligence</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0fdf4;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #166534;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .nav a {
            text-decoration: none;
            color: #166534;
            font-weight: bold;
        }
        .scan-section {
            text-align: center;
            padding: 40px;
            border: 2px dashed #166534;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .btn {
            background-color: #166534;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .card {
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }
        .healthy { color: #166534; }
        .warning { color: #991b1b; }
        
        /* Mobile adjustments */
        @media (max-width: 768px) {
            .results { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <h1>GreenTrack</h1>
        <p>Your Agricultural Intelligence Partner</p>
    </header>

    <div class="container">
        <div class="nav">
            <a href="main.html">Dashboard</a>
            <a href="tracker.html">Activity Tracker</a>
            <a href="index.html" onclick="localStorage.removeItem('user')">Logout</a>
        </div>

        <div class="scan-section">
            <h2>Scan Plant for Disease</h2>
            <p>Upload a photo to detect diseases and get solutions.</p>
            <input type="file" id="imageInput" style="margin-bottom: 20px;"><br>
            <button class="btn" onclick="analyzePlant()">Analyze Now</button>
        </div>

        <div class="results">
            <div class="card">
                <h3>Diagnostic Result</h3>
                <div id="diagnosticOutput">No analysis performed yet.</div>
            </div>
            <div class="card">
                <h3>Recommendations</h3>
                <div id="recommendationOutput">Sync location for recommendations.</div>
            </div>
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) window.location.href = 'index.html';

        async function analyzePlant() {
            const fileInput = document.getElementById('imageInput');
            if (!fileInput.files[0]) return alert("Please select an image");

            const formData = new FormData();
            formData.append('image', fileInput.files[0]);
            formData.append('plant', 'Mango'); // Default
            formData.append('email', user.email);

            document.getElementById('diagnosticOutput').innerHTML = "Analyzing...";

            try {
                // Fixed for cloud: uses relative path
                const response = await fetch('/api/predict-disease', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                document.getElementById('diagnosticOutput').innerHTML = `
                    <p class="${data.health_status === 'Healthy' ? 'healthy' : 'warning'}">
                        <strong>Status:</strong> ${data.health_status}<br>
                        <strong>Diagnosis:</strong> ${data.disease_id}
                    </p>
                    <p><strong>Solutions:</strong><br>${data.solution_steps.join('<br>')}</p>
                `;
            } catch (e) {
                document.getElementById('diagnosticOutput').innerHTML = "Error connecting to AI service.";
            }
        }
    </script>
</body>
</html>
